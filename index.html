<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="3600">
  <title>デジタルサイネージ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif;
      width: 800px;
      height: 480px;
      overflow: hidden;
      display: flex;
      padding: 3px;
    }
    .signage-container {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border: 2px solid #ffffff;
      box-sizing: border-box;
    }
    .signage-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      width: 100%;
      height: 100%;
    }
    .signage-cell {
      background-color: #000000;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    .signage-cell-date-wrapper {
      background-color: #000000;
      display: flex;
      flex-direction: column;
    }
    .signage-date {
      border-bottom: 2px solid #ffffff;
      text-align: center;
      font-size: 20px;
      color: #ffffff;
      padding: 5px 0;
      font-weight: bold;
      line-height: 1.1;
      letter-spacing: 1px;
    }
    .signage-out {
      flex: 1;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .signage-title {
      color: #ffffff;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.2em;
      line-height: 1.1;
    }
    .signage-content {
      color: #ffffff;
      font-size: 15px;
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
    }
    .signage-content-leave {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      column-gap: 8px;
    }
    .data-badge {
      display: inline-block;
      margin-right: 0.7em;
      margin-bottom: 0.25em;
    }
    .data-badge-leave {
      display: block;
      margin-bottom: 0.15em;
    }
    .period-text {
      font-size: 12px;
      color: #cccccc;
    }
    .notice-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 17px;
      margin-top: 4px;
    }
    .today-applied {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signage-container">
    <div class="signage-grid">
      <div class="signage-cell">
        <div class="signage-title">出 張</div>
        <div class="signage-content">
          <div class=" data-badge">小川博(1000)</div><div class=" data-badge">渡辺範(830)</div><div class=" data-badge">國廣(1430)</div><div class=" data-badge">宮口(1630)</div><div class=" data-badge">有路(1630)</div><div class=" data-badge">立松(1600)</div><div class=" data-badge">倉野(1530)</div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">自宅待機</div>
        <div class="signage-content">
          <div class=" data-badge">福安 <span class="period-text">(~10/31)</span></div>
        </div>
      </div>

      <div class="signage-cell-date-wrapper">
        <div class="signage-date">10月 28日(水)</div>
        <div class="signage-out">
          <div class="signage-title">外 出</div>
          <div class="signage-content" style="white-space: pre-wrap;"></div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">年 休</div>
        <div class="signage-content signage-content-leave">
          
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">遅 刻</div>
        <div class="signage-content">
          <div class=" data-badge">島崎(1110)</div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">早 退</div>
        <div class="signage-content">
          <div class=" data-badge">北川(1430)</div><div class=" data-badge today-applied">伊藤紗(PM)</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3600">
  <title>デジタルサイネージ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      padding: 10px;
    }
    .signage-frame {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      width: 100%;
      height: 100%;
    }
    .box {
      background-color: #050505;
      border: 3px solid #ffffff;
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .box-title {
      font-size: 26px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 8px;
      letter-spacing: 4px;
      display: inline-block;
    }
    .box-right-top {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .date-card {
      background-color: #050505;
      border: 3px solid #ffffff;
      border-radius: 6px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      padding: 6px 0;
      color: #ffffff;
      letter-spacing: 2px;
    }
    .content-box {
      flex: 1;
      overflow-y: auto;
      font-size: 22px;
      line-height: 1.5;
      font-weight: bold;
    }
    .item-text {
      margin-bottom: 6px;
      word-break: break-all;
    }
    .memo-text {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .red-text {
      color: #ff4d4d;
    }
    .empty {
      color: #666666;
      font-size: 20px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="signage-frame">
    <!-- 出張 -->
    <div class="box">
      <div class="box-title">出　張</div>
      <div class="content-box"><div class="item-text">立松 (~8/22)</div><div class="item-text">川村</div><div class="item-text">テニス1</div><div class="item-text">内海</div><div class="item-text">石井</div></div>
    </div>
    <!-- 自宅待機 -->
    <div class="box">
      <div class="box-title">自宅待機</div>
      <div class="empty">なし</div>
    </div>
    <!-- 日付 ＆ 外出 -->
    <div class="box-right-top">
      <div class="date-card">8月 21日(金)</div>
      <div class="box" style="flex: 1;">
        <div class="box-title">外　出</div>
        <div class="content-box memo-text">田中徳(10:00-14:00)</div>
      </div>
    </div>
    <!-- 年休 -->
    <div class="box">
      <div class="box-title">年　休</div>
      <div class="empty">なし</div>
    </div>
    <!-- 遅刻 -->
    <div class="box">
      <div class="box-title">遅　刻</div>
      <div class="empty">なし</div>
    </div>
    <!-- 早退 -->
    <div class="box">
      <div class="box-title">早　退</div>
      <div class="empty">なし</div>
    </div>
  </div>
</body>
</html>

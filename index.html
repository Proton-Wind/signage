<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="3600">
  <title>デジタルサイネージ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif;
      width: 800px;
      height: 480px;
      overflow: hidden;
      display: flex;
      padding: 3px;
    }
    .signage-container {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border: 2px solid #ffffff;
      box-sizing: border-box;
    }
    .signage-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      width: 100%;
      height: 100%;
    }
    .signage-cell {
      background-color: #000000;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    .signage-cell-date-wrapper {
      background-color: #000000;
      display: flex;
      flex-direction: column;
    }
    .signage-date {
      border-bottom: 2px solid #ffffff;
      text-align: center;
      font-size: 20px;
      color: #ffffff;
      padding: 5px 0;
      font-weight: bold;
      line-height: 1.1;
      letter-spacing: 1px;
    }
    .signage-out {
      flex: 1;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .signage-title {
      color: #ffffff;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.2em;
      line-height: 1.1;
    }
    .signage-content {
      color: #ffffff;
      font-size: 15px;
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
    }
    .signage-content-leave {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      column-gap: 8px;
    }
    .data-badge {
      display: inline-block;
      margin-right: 0.7em;
      margin-bottom: 0.25em;
    }
    .data-badge-leave {
      display: block;
      margin-bottom: 0.15em;
    }
    .period-text {
      font-size: 12px;
      color: #cccccc;
    }
    .notice-text {
      color: #ffffff;
      font-weight: bold;
      font-size: 17px;
      margin-top: 4px;
    }
    .today-applied {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signage-container">
    <div class="signage-grid">
      <div class="signage-cell">
        <div class="signage-title">出 張</div>
        <div class="signage-content">
          <div class=" data-badge">今枝 <span class="period-text">(~10/25)</span></div><div class=" data-badge">千葉 <span class="period-text">(~10/25)</span></div><div class=" data-badge">大石・石田彰・原田(800)</div><div class=" data-badge">伊藤利・青山辰(730)</div><div class=" data-badge">安武(800)</div><div class=" data-badge">浅野(800)</div><div class=" data-badge">奥田成(800)</div><div class=" data-badge">太田(800)</div><div class=" data-badge">宮口・工藤・青山喜(800)</div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">自宅待機</div>
        <div class="signage-content">
          
        </div>
      </div>

      <div class="signage-cell-date-wrapper">
        <div class="signage-date">10月 24日(土)</div>
        <div class="signage-out">
          <div class="signage-title">外 出</div>
          <div class="signage-content" style="white-space: pre-wrap;"></div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">年 休</div>
        <div class="signage-content signage-content-leave">
          <div class=" data-badge-leave">小川博</div><div class=" data-badge-leave">渡辺範</div><div class=" data-badge-leave">川村</div><div class=" data-badge-leave">石井</div><div class=" data-badge-leave">中村栄</div><div class=" data-badge-leave">安武</div><div class=" data-badge-leave">梅田千</div><div class=" data-badge-leave">岡</div><div class=" data-badge-leave">鳥山</div><div class=" data-badge-leave">加藤千</div><div class=" data-badge-leave">清水</div><div class=" data-badge-leave">辰巳</div><div class=" data-badge-leave">鈴木英</div><div class=" data-badge-leave">長瀬</div><div class=" data-badge-leave">大橋</div><div class=" data-badge-leave">梅村</div><div class=" data-badge-leave">川嶋</div><div class=" data-badge-leave">松本裕</div><div class=" data-badge-leave">岩田</div><div class=" data-badge-leave">川越</div><div class=" data-badge-leave">中原</div><div class=" data-badge-leave">山本正</div><div class=" data-badge-leave">田中徳</div><div class=" data-badge-leave">國廣</div><div class=" data-badge-leave">竹内勲</div><div class=" data-badge-leave">田端</div><div class=" data-badge-leave">坪井</div><div class=" data-badge-leave">山田健</div><div class=" data-badge-leave">福田博</div><div class=" data-badge-leave">日詰</div><div class=" data-badge-leave">近藤</div><div class=" data-badge-leave">中西</div><div class=" data-badge-leave">法兼</div><div class=" data-badge-leave">小島</div><div class=" data-badge-leave">横地</div><div class=" data-badge-leave">伊藤鋼</div>
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">遅 刻</div>
        <div class="signage-content">
          
        </div>
      </div>

      <div class="signage-cell">
        <div class="signage-title">早 退</div>
        <div class="signage-content">
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>
